# Include in nginx http{} context. Draft only; requires real, trusted TLS certificates.
log_format ugv_hmi '$remote_addr [$time_local] $request_method $uri $status';
limit_req_zone $binary_remote_addr zone=ugv_login:1m rate=10r/m;

server {
    listen 192.168.110.59:443 ssl;
    server_name 192.168.110.59;
    ssl_certificate /etc/ugv-hmi/tls/server.crt;
    ssl_certificate_key /etc/ugv-hmi/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    access_log /var/log/nginx/ugv-hmi-access.log ugv_hmi;
    error_log /var/log/nginx/ugv-hmi-error.log warn;

    # Replace supplied forwarding headers. Only loopback can reach Gunicorn.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    location = /login {
        limit_req zone=ugv_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8083;
    }
    # No direct static alias: authentication must also guard application assets.
    location / {
        proxy_pass http://127.0.0.1:8083;
    }
}
